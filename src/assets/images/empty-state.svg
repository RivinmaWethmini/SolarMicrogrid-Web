<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Shapes -->
  <ellipse cx="250" cy="300" rx="180" ry="25" fill="#1e293b" opacity="0.6" />
  
  <!-- Desk / Monitor Base -->
  <rect x="130" y="70" width="240" height="160" rx="12" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />
  <rect x="140" y="80" width="220" height="125" rx="8" fill="#0b1120" />
  <path d="M230 230h40v40h-40z" fill="#334155" />
  <path d="M200 270h100v8H200z" rx="4" fill="#475569" />

  <!-- Solar Grid Illustration on Screen -->
  <!-- Sun -->
  <circle cx="180" cy="115" r="14" fill="#fbbf24" filter="url(#glow)" opacity="0.9" />
  
  <!-- Solar Panel on Screen -->
  <polygon points="190,140 240,120 280,150 225,175" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="215" y1="130" x2="252" y2="162" stroke="#bae6fd" stroke-width="1" opacity="0.7" />
  <line x1="205" y1="155" x2="260" y2="135" stroke="#bae6fd" stroke-width="1" opacity="0.7" />

  <!-- Data Grid / Chart lines inside screen -->
  <line x1="160" y1="185" x2="320" y2="185" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  
  <!-- Empty / Search magnifying glass & leaf -->
  <circle cx="310" cy="130" r="18" stroke="#f59e0b" stroke-width="3" fill="#1e293b" />
  <line x1="324" y1="144" x2="338" y2="158" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  <path d="M305 130a5 5 0 0 1 10 0c0 4-5 8-5 8s-5-4-5-8z" fill="#10b981" />

  <!-- Floating Elements -->
  <!-- Floating Folder / Doc -->
  <g transform="translate(70, 120)">
    <rect width="60" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <line x1="12" y1="18" x2="48" y2="18" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <line x1="12" y1="28" x2="38" y2="28" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="36" x2="28" y2="36" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Floating Cloud / Sync icon -->
  <g transform="translate(360, 90)">
    <rect width="55" height="45" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M20 28a8 8 0 0 1 15-4 6 6 0 0 1 5 6h-20z" fill="#38bdf8" opacity="0.7" />
  </g>

  <!-- Sparks & Stars -->
  <path d="M120 70l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#fcd34d" opacity="0.8" />
  <path d="M380 200l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="#38bdf8" opacity="0.8" />
  <path d="M260 50l1.5 3.5 3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5z" fill="#10b981" opacity="0.8" />
</svg>
